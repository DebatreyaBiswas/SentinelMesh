services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: sentinel_falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkor_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  falkor_data:
